services:
  db:
    image: mysql:8.4
    container_name: dietaetreino-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dietaetreino
      MYSQL_USER: dietaetreino
      MYSQL_PASSWORD: dietaetreino
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Sao_Paulo
    ports:
      - "3307:3306"   # 3307 para não conflitar com MySQL de outros projetos
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:

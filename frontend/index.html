<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon fixo (coelho laranja em contorno): não muda com o tema -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8CCDB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dieta & Treino" />
    <title>Dieta & Treino</title>
    <script>
      // Tema salvo no aparelho, aplicado antes da tela aparecer (o app atualiza o resto depois)
      ;(function () {
        var dirs = { neutro: 'neutro', coelhinha: 'coelhinha', onca: 'onca', dark: 'rato', tigrao: 'tigrao' }
        var colors = { neutro: '#141518', coelhinha: '#F8CCDB', onca: '#FDE7D3', dark: '#141518', tigrao: '#E3EAF3' }
        var t = localStorage.getItem('dt_theme')
        if (!dirs[t]) t = 'neutro' // padrão
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name="theme-color"]').content = colors[t]
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
